name: Clear Signing Tests Results

# Clear Signing Tests runs as pull_request, and a fork run gets a read-only
# token. So the results comment must come from here, where the token can write.
# clear-signing-tests-started.yml writes the note that this workflow replaces,
# and both write the same "## Clear Signing Tests" comment.
#
# The test jobs give the verdict, so a lost comment cannot make a failed pull
# request look green. The workflow name below is matched as a string.
on:
  workflow_run:
    workflows: ["Clear Signing Tests"]
    types: [completed]

concurrency:
  # The workflow_run payload has no pull request number, so the head repository
  # and branch identify the pull request instead.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write

jobs:
  post-implementation-results:
    name: Post implementation results to PR
    # A cancelled run has partial artifacts and races the run that replaced it.
    # A failed run is the interesting case and must not be excluded.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The rendering script comes from the default branch, because a
      # workflow_run event runs there. A fork cannot change it.
      - name: Checkout the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download the pull request context
        id: context
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-context
          path: pr-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the test coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-coverage
          path: test-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the runner results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: results__*
          merge-multiple: true
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the results comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        # The commit under test, and the start and end time of the run, come
        # from the workflow_run event, not from the artifact, so a fork cannot
        # change them. A reviewer can therefore see if the results belong to
        # the head of the pull request or to an older commit.
        run: node .github/scripts/render-test-results.js --context pr-context --artifacts artifacts --coverage test-coverage > results.md

      - name: Post PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const { owner, repo } = context.repo;
            const workspace = process.env.GITHUB_WORKSPACE;

            // A fork wrote the artifact, so the pull request must come from
            // the event, which a fork cannot change.
            const headRepo = process.env.RUN_HEAD_REPO;
            const headBranch = process.env.RUN_HEAD_BRANCH;
            const { data: open } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${headRepo.split('/')[0]}:${headBranch}`, per_page: 100,
            });
            const pr = open.find(
              (p) => p.head.sha === process.env.RUN_HEAD_SHA && p.head.repo?.full_name === headRepo,
            );
            if (!pr) {
              core.info(`No open pull request at ${headRepo}@${process.env.RUN_HEAD_SHA}. No comment.`);
              return;
            }
            const issue_number = pr.number;

            // Writes, replaces or removes one comment. An empty text removes it.
            const RESULTS = '## Clear Signing Tests';
            const RECOMMENDATIONS = '<!-- erc7730-recommended-fields -->';
            const upsert = async (text, marker = RESULTS) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
              );
              if (text === '') {
                if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                return;
              }
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
              }
            };

            // A separate comment, and not part of the results, because it never
            // blocks the pull request.
            let recommendations = '';
            try {
              recommendations = fs.readFileSync(path.join(workspace, 'pr-context', 'recommendations.md'), 'utf8').trim();
            } catch {
              // The test run failed before it could collect them.
            }
            await upsert(recommendations, RECOMMENDATIONS);

            // The results, rendered by the step above. An empty file means
            // that the run affected no descriptor, so the comment goes away.
            await upsert(fs.readFileSync(path.join(workspace, 'results.md'), 'utf8'));
