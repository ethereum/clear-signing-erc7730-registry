name: Triage red PRs

# Runs .github/scripts/triage-red-prs.js once a week as a dry run and writes
# the plan to the job summary, so the maintainers see what the script would
# do without a local setup. A manual run with the "apply" input posts the
# comments and closes the pull requests. See .github/scripts/triage-red-prs.README.md.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Post the comments and close the pull requests"
        type: boolean
        default: false
      weeks:
        description: "Inactivity threshold in weeks"
        type: number
        default: 4

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: ${{ inputs.apply && 'Apply the plan' || 'Print the plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Run the triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
          WEEKS: ${{ inputs.weeks || 4 }}
        run: |
          set -o pipefail
          {
            echo '```'
            node .github/scripts/triage-red-prs.js --repo "$GITHUB_REPOSITORY" --weeks "$WEEKS" --verbose $APPLY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
