name: ✨ pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#env:
#  ETHERSCAN_API_HOST: <set this secret to define a custom Etherscan API host>
#  ETHERSCAN_API_KEY: <set this secret to inject Etherscan API key>

jobs:
  validate_descriptors:
    name: 🔎 validate descriptors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get all changed descriptor and shared files
        timeout-minutes: 5
        id: changed-descriptor-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            registry/**/*.json
            ercs/**/*.json
          files_ignore: |
            registry/**/tests/**
            registry/**/testsv2/**
            registry/**/sigs/**
            registry/**/*.tests.json

      - name: Resolve affected descriptors
        timeout-minutes: 5
        id: affected-descriptors
        if: steps.changed-descriptor-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-descriptor-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-descriptor-files.outputs.deleted_files }}
        run: |
          # A changed shared file (ercs/*.json or an entity-local common file)
          # affects every descriptor whose "includes" chain contains it, so
          # those descriptors must be linted too. Shared files are not linted
          # standalone — they are partial descriptors, validated through their
          # includers.
          RESULT=$(CHANGED_FILES="$CHANGED_FILES $DELETED_FILES" \
            node .github/scripts/list-affected-descriptors.js)
          echo "$RESULT" | jq .
          echo "descriptors=$(echo "$RESULT" | jq -r '.affected_descriptors | join(" ")')" >> $GITHUB_OUTPUT
          echo "any_affected=$(echo "$RESULT" | jq -r '.has_affected')" >> $GITHUB_OUTPUT

      - name: Setup python
        timeout-minutes: 10
        if: steps.affected-descriptors.outputs.any_affected == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ERC-7730 library
        timeout-minutes: 10
        if: steps.affected-descriptors.outputs.any_affected == 'true'
        run: pip install -r .github/requirements.txt

      - name: Validate ERC-7730 descriptors affected by pull request
        timeout-minutes: 120
        if: steps.affected-descriptors.outputs.any_affected == 'true'
        env:
          AFFECTED_FILES: ${{ steps.affected-descriptors.outputs.descriptors }}
        run: erc7730 lint $AFFECTED_FILES --gha

  validate_schemas:
    name: 🔎 validate JSON schemas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get all changed JSON files
        timeout-minutes: 5
        id: changed-json-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            registry/**/*.json
            ercs/**/*.json

      - name: Setup python
        timeout-minutes: 10
        if: steps.changed-json-files.outputs.any_changed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install check-jsonschema
        timeout-minutes: 10
        if: steps.changed-json-files.outputs.any_changed == 'true'
        run: pip install -r .github/requirements-schema.txt

      - name: Validate changed files against JSON schemas
        timeout-minutes: 60
        if: steps.changed-json-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-json-files.outputs.all_changed_files }}
        run: |
          DEFAULT_SCHEMA="specs/erc7730-v2.schema.json"
          TESTS_V1_SCHEMA="specs/erc7730-tests.schema.json"
          TESTS_V2_SCHEMA="specs/erc7730-tests-v2.schema.json"
          FAILED=0

          for file in $CHANGED_FILES; do
            if echo "$file" | grep -qE '/sigs/'; then
              echo "Skipping $file (auditor attestation, no schema yet)"
              continue
            fi

            # Resolve schema — folder-based dispatch for test files takes precedence,
            # since legacy test files do not carry a $schema field.
            if echo "$file" | grep -qE '/testsv2/.*\.tests\.json$'; then
              SCHEMA_PATH="$TESTS_V2_SCHEMA"
            elif echo "$file" | grep -qE '/tests/.*\.tests\.json$'; then
              SCHEMA_PATH="$TESTS_V1_SCHEMA"
            else
              # Descriptor / shared / ercs file — read its $schema field if present.
              SCHEMA_REF=$(python3 -c '
          import json, sys
          try:
              with open(sys.argv[1]) as f:
                  data = json.load(f)
              print(data.get("$schema", ""))
          except Exception:
              print("")
          ' "$file")

              if [ -z "$SCHEMA_REF" ]; then
                SCHEMA_PATH="$DEFAULT_SCHEMA"
              elif echo "$SCHEMA_REF" | grep -qE '^https?://'; then
                SCHEMA_PATH="$DEFAULT_SCHEMA"
              else
                FILE_DIR=$(dirname "$file")
                RESOLVED=$(cd "$FILE_DIR" && realpath -m "$SCHEMA_REF" 2>/dev/null || echo "")
                if [ -n "$RESOLVED" ] && [ -f "$RESOLVED" ]; then
                  SCHEMA_PATH="$RESOLVED"
                else
                  SCHEMA_PATH="$DEFAULT_SCHEMA"
                fi
              fi
            fi

            echo "::group::Validating $file against $SCHEMA_PATH"
            if ! check-jsonschema --schemafile "$SCHEMA_PATH" "$file"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more files failed JSON schema validation"
            exit 1
          fi

  validate_index:
    name: 🔎 validate index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get all changed descriptor files
        timeout-minutes: 5
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            registry/**/*.json
            ercs/**/*.json
          files_ignore: |
            registry/**/tests/**
            registry/**/testsv2/**

      - name: Setup node
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Check that the index can still be built
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        # Each (chainId, address) maps to exactly one calldata descriptor, and
        # two descriptors cannot register the same EIP-712 encodeType at one
        # address. A pull request that breaks either would leave the index
        # ungeneratable, which only surfaces after the merge, in the
        # sync-indexes workflow — by then the conflict is already on master.
        run: node tools/scripts/generate-index.js --validate

  test_tools:
    name: 🔎 test index generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get all changed tool files
        timeout-minutes: 5
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            tools/scripts/**
            .github/scripts/**
            package.json
            package-lock.json

      - name: Setup node
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Run tests
        timeout-minutes: 10
        if: steps.changed-files.outputs.any_changed == 'true'
        # index.eip712.json keys are a tagged union of eip155: deployments and
        # eip712-domain-separator: separators. Consumers that resolve only the
        # first tag keep working while the namespaces stay disjoint, no
        # descriptor lands in both, and keys stay normalized. None of that is
        # visible in the generated index once a regression has flattened it.
        run: npm test

  validate_file_names:
    name: 🔎 validate file names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check the file names in each entity folder
        timeout-minutes: 5
        run: |
          # The prefix says what a file is, and the three subfolders below have
          # their own names.
          FAILED=0
          while IFS= read -r file; do
            echo "::error file=${file},line=1::Unexpected name. A file in an entity folder must be calldata-*.json, eip712-*.json or common-*.json — see the \"Registry structure\" section of README.md."
            FAILED=1
          done < <(find registry -mindepth 2 \
                     \( -type d \( -name tests -o -name testsv2 -o -name sigs \) -prune \) -o \
                     \( -type f \
                        ! -name 'calldata-*.json' \
                        ! -name 'eip712-*.json' \
                        ! -name 'common-*.json' -print \))

          [ "$FAILED" -eq 0 ] || exit 1

  validate_attested_descriptors:
    name: 🔎 validate attested descriptors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get all changed descriptor and shared files
        timeout-minutes: 5
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            registry/**/*.json
            ercs/**/*.json
          files_ignore: |
            registry/**/tests/**
            registry/**/testsv2/**
            registry/**/sigs/**
            registry/**/*.tests.json

      - name: Check that no attested descriptor changed
        timeout-minutes: 5
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        run: |
          # Without this, jq hides a failure of the script and the check passes.
          set -o pipefail

          # A shared file is inlined through "includes", so it also changes
          # every descriptor that includes it.
          AFFECTED=$(CHANGED_FILES="$CHANGED_FILES $DELETED_FILES" \
            node .github/scripts/list-affected-descriptors.js | jq -r '.affected_descriptors[]')

          FOUND=0
          while IFS= read -r descriptor; do
            [ -n "$descriptor" ] || continue
            name=$(basename "$descriptor" .json)
            for sig in "$(dirname "$descriptor")"/sigs/"$name".eip155-*.json; do
              [ -e "$sig" ] || continue
              echo "::error file=${descriptor},line=1::An auditor attested this descriptor in ${sig}, and this pull request changes it. Add a new descriptor file instead — the file name carries the version. The attestation then stays valid for the old descriptor, and an auditor can attest the new one later."
              FOUND=$((FOUND + 1))
            done
          done <<< "$AFFECTED"

          [ "$FOUND" -eq 0 ] && exit 0

          # GitHub shows 10 annotations per step, so give the total as well.
          echo "${FOUND} attested descriptor(s) are affected. See the log for the full list." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check that no attested descriptor was deleted or renamed
        timeout-minutes: 5
        run: |
          # A rename looks the same as a delete, because the name is the only
          # bond between an attestation and its descriptor.
          FOUND=0
          while IFS= read -r sig; do
            name=$(basename "$sig" | sed -E 's/\.eip155-[0-9]+-0x[0-9a-fA-F]+\.json$//')
            descriptor="$(dirname "$(dirname "$sig")")/${name}.json"
            [ -e "$descriptor" ] && continue
            echo "::error file=${sig},line=1::An auditor attested ${name}, but that descriptor is no longer here. Do not delete or rename an attested descriptor. Add a new descriptor file instead, and keep the attested one."
            FOUND=$((FOUND + 1))
          done < <(find registry -path '*/sigs/*.json')

          [ "$FOUND" -eq 0 ] && exit 0

          # GitHub shows 10 annotations per step, so give the total as well.
          echo "${FOUND} attestation(s) have no descriptor. See the log for the full list." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
