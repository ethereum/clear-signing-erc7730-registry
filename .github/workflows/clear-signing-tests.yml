name: Clear Signing Tests

# The runners consume no secrets, so this workflow runs on pull_request for
# every pull request, including one from a fork. A fork run gets a read-only
# token and cannot write the results comment; clear-signing-tests-results.yml
# posts it afterwards, from the base repository.
on:
  pull_request:
    paths:
      - "registry/**/*.json"
      - "ercs/**/*.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

