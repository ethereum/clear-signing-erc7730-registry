name: 🔄 sync spec files from upstream ERCs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH: "master"

jobs:
  sync-specs:
    name: sync spec files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get date
        timeout-minutes: 10
        run: echo "CURRENT_DATE=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_ENV

      # File mapping (upstream -> local):
      #   ERCS/erc-7730.md                                -> specs/erc-7730.md
      #   assets/erc-7730/erc7730-v*.schema.json (all)    -> specs/erc7730-v*.schema.json
      #
      # The schema files are listed from upstream at run time rather than
      # named here, so that a new exact-version file (erc7730-v2.0.1), a
      # release candidate (-rc.N) or the draft (-next) arrives without a
      # change to this workflow. A schema file that upstream removed, which
      # the ERC only allows for release candidates once their version is
      # final, is removed here too.
      - name: Fetch upstream spec files
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsSL "https://raw.githubusercontent.com/ethereum/ERCs/master/ERCS/erc-7730.md" \
            -o specs/erc-7730.md

          gh api repos/ethereum/ERCs/contents/assets/erc-7730 \
            --jq '.[] | select(.type == "file") | select(.name | test("^erc7730-v[0-9].*\\.schema\\.json$")) | .name' \
            | sort > upstream-schema-files.txt

          if [ ! -s upstream-schema-files.txt ]; then
            echo "::error::No schema files listed upstream; refusing to sync"
            exit 1
          fi

          while IFS= read -r name; do
            curl -fsSL "https://raw.githubusercontent.com/ethereum/ERCs/master/assets/erc-7730/${name}" \
              -o "specs/${name}"
          done < upstream-schema-files.txt

          for local in specs/erc7730-v[0-9]*.schema.json; do
            name=$(basename "$local")
            if ! grep -qxF "$name" upstream-schema-files.txt; then
              echo "Removing ${local}: no longer published upstream"
              git rm -q "$local"
            fi
          done

          rm -f upstream-schema-files.txt

      - name: Check changes
        id: changes
        timeout-minutes: 10
        shell: bash
        run: |
          [[ -n "$(git status -s)" ]] && echo "changes=true" >> $GITHUB_OUTPUT || true

      - name: Open pull request
        if: ${{ !cancelled() && steps.changes.outputs.changes == 'true' }}
        timeout-minutes: 10
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: ${{ env.BRANCH }}-sync-specs
          base: ${{ env.BRANCH }}
          delete-branch: false
          commit-message: "chore: sync spec files from upstream ERCs - ${{ env.CURRENT_DATE }}"
          title: "chore: sync spec files from upstream ERCs - ${{ env.CURRENT_DATE }}"
          body: |
            Automated sync of spec files from [ethereum/ERCs](https://github.com/ethereum/ERCs).

            Files synced:
            - `ERCS/erc-7730.md` -> `specs/erc-7730.md`
            - every `assets/erc-7730/erc7730-v*.schema.json` -> `specs/` (exact versions, release candidates and the `-next` draft)

            If a schema file changed, the "validate every file against a changed schema" check on this pull request validates the whole registry against it.
          draft: false
          signoff: false
