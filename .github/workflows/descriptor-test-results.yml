name: Descriptor Test Results

# Posts the results of every runner on the pull request, in one comment with
# one column per implementation, so a reviewer sees a failed or divergent
# case without a look at the run logs.
#
# The Descriptor Tests workflow runs as pull_request, and a fork run gets a
# read-only token. So the results comment must come from here: workflow_run
# gives a write token, and the run uses the workflow file and the scripts of
# the default branch, which a fork cannot change. The run reads only the
# artifacts of the test run, as data. descriptor-tests-queued.yml writes the
# note that this workflow replaces, and both write the same
# "## Clear Signing Tests" comment.
#
# This workflow also builds the test report bundle of the run and publishes it
# to the test-reports branch, where the test report viewer reads it. The
# comment links to the viewer. See .github/test-runner-docs/bundle.md.
#
# The test jobs give the verdict, so a lost comment or a lost report cannot
# make a failed pull request look green. The workflow name below is matched
# as a string.
on:
  workflow_run:
    workflows: ["Descriptor Tests"]
    types: [completed]

concurrency:
  # The workflow_run payload has no pull request number, so the head repository
  # and branch identify the pull request instead.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  # For the push to the test-reports branch. The other branches are protected
  # by the repository rules, not by this token.
  contents: write
  pull-requests: write

env:
  # The test report viewer. The comment links to it with the pull request and
  # the run, and the viewer reads the bundle from the test-reports branch.
  REPORT_BASE_URL: https://tests.erc7730.sourcify.dev/
  REPORTS_BRANCH: test-reports

jobs:
  post-implementation-results:
    name: Post the results and the report
    # A cancelled run has partial artifacts and races the run that replaced it.
    # A failed run is the interesting case and must not be excluded.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the pull request context
        id: context
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-context
          path: pr-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the test coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-coverage
          path: test-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the runner results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: results__*
          merge-multiple: true
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A fork wrote the artifacts, so the pull request must come from the
      # event, which a fork cannot change.
      - name: Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headRepo = process.env.RUN_HEAD_REPO;
            const headBranch = process.env.RUN_HEAD_BRANCH;
            const { data: open } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${headRepo.split('/')[0]}:${headBranch}`, per_page: 100,
            });
            const pr = open.find(
              (p) => p.head.sha === process.env.RUN_HEAD_SHA && p.head.repo?.full_name === headRepo,
            );
            if (!pr) {
              core.info(`No open pull request at ${headRepo}@${process.env.RUN_HEAD_SHA}. No comment.`);
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('url', pr.html_url);
            core.setOutput('title', pr.title);

      # The scripts come from the default branch, so a fork cannot change
      # them. Every step up to the comment continues on error: the comment
      # matters more than the report.
      #
      # The token of this job can write, so it stays out of reach of the
      # dependencies: the checkout keeps no credentials, the install runs no
      # package scripts, and no cache is restored.
      - name: Checkout the scripts
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: scripts
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            package.json
            package-lock.json

      - name: Setup node
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install the dependencies of the scripts
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        working-directory: scripts
        run: npm ci --ignore-scripts

      # The run and the pull request come from the event and from the step
      # above, not from the artifact, so a fork cannot change them. The base
      # commit comes from the context artifact, which the detect job wrote
      # from the pull_request event.
      - name: Build the test report bundle
        id: bundle
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          mkdir -p artifacts pr-context
          node scripts/.github/scripts/build-bundle.js \
            --context pr-context --artifacts artifacts --output report/bundle.json

      - name: Publish the bundle to the test-reports branch
        id: publish
        if: steps.pr.outputs.found == 'true' && steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          BRANCH: ${{ env.REPORTS_BRANCH }}
          BUNDLE: report/bundle.json
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKDIR: reports
          SCRIPTS_DIR: scripts/.github/scripts
        # The two links come from the same values as the file name that
        # publish-report.sh writes, pr/<number>/<run id>.json: the event, not
        # an artifact. url is the viewer; bundle_url is the raw bundle, for an
        # agent.
        run: |
          bash scripts/.github/scripts/publish-report.sh
          echo "url=${REPORT_BASE_URL}?pr=${PR_NUMBER}&run=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "bundle_url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/pr/${PR_NUMBER}/${RUN_ID}.json" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Empty when the report was not published, so the comment has no link.
          REPORT_URL: ${{ steps.publish.outcome == 'success' && steps.publish.outputs.url || '' }}
          BUNDLE_URL: ${{ steps.publish.outcome == 'success' && steps.publish.outputs.bundle_url || '' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // GitHub rejects a comment body above 65536 characters. The coverage
            // messages have no fixed limit, so the guard stays.
            const MAX_BODY = 60000;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.RUN_ID}`;
            const workspace = process.env.GITHUB_WORKSPACE;
            const artifactsRoot = path.join(workspace, 'artifacts');
            const contextRoot = path.join(workspace, 'pr-context');
            const issue_number = Number(process.env.PR_NUMBER);
            const reportUrl = process.env.REPORT_URL || '';
            const bundleUrl = process.env.BUNDLE_URL || '';
            const instructionsUrl =
              `${context.serverUrl}/${owner}/${repo}/blob/master/.github/test-runner-docs/agent-instructions.md`;

            // The artifact can be absent when the test run failed early. Say so,
            // instead of leaving the "in progress" note on the pull request.
            let ctx;
            try {
              ctx = JSON.parse(fs.readFileSync(path.join(contextRoot, 'context.json'), 'utf8'));
            } catch (e) {
              core.warning(`No usable pull request context: ${e.message}`);
              ctx = null;
            }

            // Runner strings are untrusted. Keep them inside one line.
            const line = (v) =>
              String(v ?? '')
                .replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
                .replace(/\|/g, '\\|')
                .replace(/[\r\n]+/g, ' ');
            // And short.
            const cell = (v) => line(v).slice(0, 200);
            // "1 function has", "2 functions have".
            const count = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
            const has = (n) => (n === 1 ? 'has' : 'have');

            // The conclusion of the test run, from the event. When a runner
            // job crashes before it writes results, it uploads no artifact,
            // and the rows below hold only the other implementations. Every
            // row can pass there, so the uploaded results alone must not
            // give a green verdict on a run that did not succeed.
            const conclusion = process.env.RUN_CONCLUSION || '';
            // The jobs of the test run that did not succeed, to name the
            // cause. The names come from the jobs API of this repository,
            // not from an artifact, but they still go through cell(). When
            // the API call fails, the sentence stands without the names.
            let failedJobs = [];
            if (conclusion !== 'success') {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: Number(process.env.RUN_ID), per_page: 100,
                });
                failedJobs = jobs
                  .filter((j) => ['failure', 'cancelled', 'timed_out'].includes(j.conclusion))
                  .map((j) => cell(j.name));
              } catch (e) {
                core.warning(`Could not list the jobs of the test run: ${e.message}`);
              }
            }
            const failedJobsSentence =
              failedJobs.length > 0 ? ` Failed jobs: ${failedJobs.join(', ')}.` : '';

            // Each runner uploads one artifact that holds one
            // `<slug>__<entity>__<descriptor>.json` per descriptor. With
            // merge-multiple: true they all land flat in artifactsRoot, with
            // no collisions.
            let resultFiles = [];
            try {
              resultFiles = fs.readdirSync(artifactsRoot).filter(f => f.endsWith('.json'));
            } catch (e) {
              core.warning(`Could not read ${artifactsRoot}: ${e.message}`);
            }
            core.info(`Matched ${resultFiles.length} result JSON files`);

            // The commit under test, and the start and end time of the run.
            // All three come from the workflow_run event, not from the
            // artifact, so a fork cannot change them. A reviewer can therefore
            // see if the results belong to the head of the pull request or to
            // an older commit.
            const testedSha = process.env.RUN_HEAD_SHA;
            const utc = (value) =>
              Number.isNaN(Date.parse(value))
                ? 'an unknown time'
                : `${new Date(value).toISOString().slice(0, 16).replace('T', ' ')} UTC`;
            // "2026-09-24 14:35–14:36 UTC", or both full times when the dates differ.
            const span = (start, end) => {
              const [a, b] = [utc(start), utc(end)];
              return a.slice(0, 10) === b.slice(0, 10) && !a.startsWith('an ')
                ? `${a.slice(0, 16)}–${b.slice(11)}`
                : `${a} – ${b}`;
            };
            const footer =
              `<sub>Tested [\`${testedSha.slice(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${testedSha})` +
              ` · [run ${process.env.RUN_ID}](${runUrl})` +
              ` · ${span(process.env.RUN_STARTED_AT, process.env.RUN_COMPLETED_AT)}</sub>\n`;

            // Writes, replaces or removes one comment. An empty text removes it.
            const RESULTS = '## Clear Signing Tests';
            // The marker of the recommendations comment that older runs wrote.
            // The suggestions are now in the test report, so the comment is
            // only found here to delete it.
            const RECOMMENDATIONS = '<!-- erc7730-recommended-fields -->';
            const upsert = async (text, marker = RESULTS) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
              );
              if (text === '') {
                if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                return;
              }
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
              }
            };

            // Delete the recommendations comment of an older run. This comes
            // before the branches below, which return early.
            await upsert('', RECOMMENDATIONS);

            // The suggestions of check-recommended-fields.js. Only the count is
            // used here; the test report lists them. The file comes from a
            // fork, so only a version 1 file counts, and only the items that
            // build-bundle.js keeps: an object with string type, file,
            // pointer and message.
            let suggestions = 0;
            try {
              const doc = JSON.parse(fs.readFileSync(path.join(contextRoot, 'recommendations.json'), 'utf8'));
              if (doc?.version === 1 && Array.isArray(doc.items)) {
                suggestions = doc.items.filter(
                  (i) => i !== null && typeof i === 'object' &&
                    ['type', 'file', 'pointer', 'message'].every((k) => typeof i[k] === 'string'),
                ).length;
              }
            } catch {
              // The test run failed before it could collect them, or an older
              // script wrote Markdown.
            }

            // The test run failed before it could describe itself.
            if (ctx === null) {
              await upsert(
                `${RESULTS}\n\n❌ The test run stopped before it produced results.${failedJobsSentence} See the [run](${runUrl}).\n\n${footer}`,
              );
              return;
            }

            // Nothing was affected, so there is nothing to report.
            if (!ctx.has_affected) {
              await upsert('');
              return;
            }

            // require-testsv2 already failed the run, but the annotations do
            // not explain how to fix it.
            const missing = ctx.missing_tests ?? [];

            // check-test-coverage already failed the run, like require-testsv2.
            // Its report maps each descriptor to its error messages. The usual
            // message starts with "<n> of <m> function(s) have no test", so the
            // functions can be counted. The other messages are about the test file.
            let coverage = {};
            try {
              coverage = JSON.parse(fs.readFileSync(path.join(workspace, 'test-coverage', 'coverage.json'), 'utf8'));
            } catch {
              // The job did not run, or the run failed before it.
            }
            const gaps = Object.entries(coverage);
            let untested = 0;
            let otherGaps = false;
            for (const [, messages] of gaps) {
              for (const message of messages) {
                const m = /^(\d+) of \d+ function\(s\) have no test/.exec(String(message));
                if (m) untested += Number(m[1]);
                else otherGaps = true;
              }
            }

            // rows: keyed by entity|descriptor|description, with the status of
            // each implementation.
            const rows = new Map();
            const impls = new Set();
            for (const file of resultFiles) {
              let data;
              try { data = JSON.parse(fs.readFileSync(path.join(artifactsRoot, file), 'utf8')); }
              catch (e) { core.warning(`Could not parse ${file}: ${e.message}`); continue; }
              const impl = data.implementation || file;
              impls.add(impl);
              // filename: <slug>__<entity>__<descriptor>.json
              const parts = file.replace(/\.json$/, '').split('__');
              const entity = parts[1];
              const descriptor = parts[2];
              for (const c of data.cases || []) {
                const key = `${entity}|${descriptor}|${c.description}`;
                if (!rows.has(key)) rows.set(key, { entity, descriptor, byImpl: {} });
                rows.get(key).byImpl[impl] = c.status;
              }
            }
            const implList = [...impls].sort();
            // A case passes only when every implementation reports pass. A fail,
            // an error, a skip or no result all count as "does not pass".
            const total = rows.size;
            const failed = [...rows.values()].filter((r) => implList.some((i) => r.byImpl[i] !== 'pass')).length;
            const ran = ctx.has_tests && total > 0;

            // The verdict: one short sentence for each problem, then the pass
            // sentence, so the author sees when only the missing tests block.
            const problems = [];
            if (ran && failed > 0) {
              problems.push(`${failed} of ${count(total, 'test case')} ${failed === 1 ? 'does' : 'do'} not pass on every implementation.`);
            }
            if (missing.length > 0) problems.push(`${count(missing.length, 'descriptor')} ${has(missing.length)} no test file.`);
            if (gaps.length > 0) {
              problems.push(
                otherGaps
                  ? `${count(gaps.length, 'descriptor')} ${gaps.length === 1 ? 'fails' : 'fail'} the test coverage check.`
                  : `${count(untested, 'function')} ${has(untested)} no test case.`,
              );
            }
            const passSentence =
              total === 1 ? 'The 1 test case passes on every implementation.' : `All ${total} test cases pass on every implementation.`;
            let verdict;
            if (!ctx.has_tests) {
              verdict = ['❌', ...problems, 'No tests ran.'].join(' ');
            } else if (!ran && problems.length === 0) {
              verdict = `⚠️ The test runners produced no results.${failedJobsSentence} See the [run](${runUrl}).`;
            } else if (!ran) {
              verdict = ['❌', ...problems, `The test runners produced no results.${failedJobsSentence} See the [run](${runUrl}).`].join(' ');
            } else if (problems.length === 0 && conclusion === 'success') {
              verdict = `✅ ${passSentence}`;
            } else if (problems.length === 0) {
              // The results that were uploaded all pass, but the run is red,
              // so a runner probably crashed before it wrote its results.
              const uploadedPass = total === 1
                ? 'The 1 test case in the uploaded results passes'
                : `All ${total} test cases in the uploaded results pass`;
              verdict = `⚠️ ${uploadedPass}, but the test run did not succeed.${failedJobsSentence} See the [run](${runUrl}).`;
            } else {
              verdict = `❌ ${[...problems, ...(failed === 0 ? [passSentence] : [])].join(' ')}`;
            }

            let body = `${RESULTS}\n\n${verdict}\n\n`;

            // The report page shows what each case rendered, the diff between
            // the implementations, and the coverage. The URL is built by the
            // workflow from the event, not from an artifact.
            if (reportUrl !== '') {
              let host = reportUrl;
              try { host = new URL(reportUrl).host; } catch {}
              body += `📊 [Open Full Test Report on ${host}](${reportUrl})\n\n`;
            } else if (failed > 0) {
              body += `The test report could not be published. The [run](${runUrl}) shows each case that did not pass.\n\n`;
            } else {
              body += `The test report could not be published. See the [run](${runUrl}).\n\n`;
            }

            // One line per implementation, only when a case does not pass.
            if (ran && failed > 0) {
              for (const impl of implList) {
                const kinds = {};
                const where = [];
                let passed = 0;
                for (const r of rows.values()) {
                  const status = r.byImpl[impl] ?? 'not run';
                  if (status === 'pass') { passed++; continue; }
                  const kind = ['fail', 'error', 'skipped'].includes(status) ? status : 'not run';
                  kinds[kind] = (kinds[kind] ?? 0) + 1;
                  const name = `\`${cell(r.entity)}/${cell(r.descriptor)}\``;
                  if (!where.includes(name)) where.push(name);
                }
                let text = `- \`${cell(impl)}\`: ${passed} of ${total} pass`;
                if (passed < total) {
                  const shown = where.slice(0, 3);
                  const rest = where.length - shown.length;
                  const list = rest > 0
                    ? `${shown.join(', ')} and ${rest} more`
                    : shown.length > 1 ? `${shown.slice(0, -1).join(', ')} and ${shown.at(-1)}` : shown[0];
                  const kindList = Object.entries(kinds);
                  text += kindList.length === 1 && kinds.fail
                    ? `. ${kinds.fail} fail in ${list}`
                    : ` (${kindList.map(([k, n]) => `${n} ${k}`).join(', ')}). ${total - passed} do not pass in ${list}`;
                }
                body += `${text}\n`;
              }
              body += '\n';
            }

            // Suggestions never block, so they do not change the verdict.
            if (suggestions > 0) {
              const one = suggestions === 1;
              body += one
                ? '💡 1 suggestion. It does not block this PR. '
                : `💡 ${suggestions} suggestions. They do not block this PR. `;
              body +=
                reportUrl !== ''
                  ? `The full test report lists ${one ? 'it' : 'them'}.\n\n`
                  : `See \`recommendations.json\` in the pr-context artifact of the [run](${runUrl}).\n\n`;
            }

            // A pointer for a coding agent, when there is something to fix and
            // the bundle is published. Both links come from this workflow.
            const toFix = (ran && failed > 0) || missing.length > 0 || gaps.length > 0 || suggestions > 0;
            if (toFix && bundleUrl !== '') {
              body +=
                `🤖 For an agent: read the [test results as JSON](${bundleUrl}) ` +
                `and follow the [fix instructions](${instructionsUrl}).\n\n`;
            }

            if (missing.length > 0) {
              body += '**Descriptors without a test file**\n\n';
              for (const descriptor of missing) body += `- \`${cell(descriptor)}\`\n`;
              body +=
                '\nCreate a test file at `registry/<entity>/testsv2/<descriptor-name>.tests.json`. ' +
                'See [testing documentation](../blob/master/README.md#reference-test-cases) for details.\n\n';
            }

            if (gaps.length > 0) {
              body += otherGaps ? '**Descriptors that fail the test coverage check**\n\n' : '**Functions without a test case**\n\n';
              for (const [descriptor, messages] of gaps) {
                body += `- \`${cell(descriptor)}\`\n`;
                for (const message of messages) body += `  - ${line(message).slice(0, 1000)}\n`;
              }
              body += '\n';
            }

            if (body.length > MAX_BODY) {
              body = `${body.slice(0, MAX_BODY)}\n\n… truncated. See the [run](${runUrl}).\n\n`;
            }

            await upsert(body + footer);
