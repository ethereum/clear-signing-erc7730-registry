name: AI Review

# An advisory review of the descriptors of a pull request by an LLM. It runs
# after the deterministic checks and never blocks a merge.
#
# The gate job below runs on workflow_run of Descriptor Tests, the slower of
# the two workflows that check a pull request. workflow_run uses the workflow
# file of the default branch and has access to secrets, so nothing from the
# pull request is ever executed here: the gate reads the run conclusions, the
# changed file list and the test report bundle through the GitHub API, as
# data. When Registry Checks is still running, the gate waits for it, in the
# same loop that waits for the bundle.
#
# Descriptor Test Results, the workflow that publishes the bundle, is not the
# trigger: a run started by workflow_run is recorded against the default
# branch, so it does not identify the pull request.
#
# workflow_dispatch runs the same jobs on a given pull request. It tests a
# branch of this workflow before it reaches the default branch, and re-runs
# a review by hand.
on:
  workflow_run:
    workflows: ["Descriptor Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # The workflow_run payload has no pull request number, so the head
  # repository and branch identify the pull request instead.
  group: ${{ github.workflow }}-${{ github.event.inputs.pull_request || format('{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    # Red tests cannot pass the gate, so the job does not start. The gate
    # script checks Registry Checks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      # The default branch, or the dispatched branch: never the pull request.
      - name: Checkout the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the pull request and fetch its test report bundle
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node .github/scripts/ai-review-gate.js --pr "$PR_NUMBER" --out ai-review
          else
            node .github/scripts/ai-review-gate.js --out ai-review
          fi

      - name: Upload the test report bundle
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-bundle
          path: ai-review/bundle.json
          retention-days: 7
