name: AI Review

# An advisory review of the descriptors of a pull request by an LLM. It runs
# after the deterministic checks and never blocks a merge.
#
# The workflow runs on pull_request_target, like the queued note and the
# labels: it starts with the pull request, so it shows among its checks, and
# it runs the workflow file of the base branch with secrets and a token that
# can write, which a pull_request run from a fork never gets. Nothing from
# the pull request is executed here, and nothing from it reaches a shell
# line: the gate reads the run conclusions, the changed file list and the
# test report bundle through the GitHub API, as data, and the only checkout
# is the scripts of the base branch. Keep it that way in every job.
#
# The gate starts alongside Registry Checks and Descriptor Tests, so it
# waits for both to complete, then for Descriptor Test Results to publish the
# test report bundle on the test-reports branch. A new push cancels the
# waiting run through the concurrency group.
#
# workflow_dispatch runs the same jobs on a given pull request, to re-run a
# review by hand. It needs a version of this file on the default branch.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    # The same files as Descriptor Tests: without a descriptor change there
    # is no test run and no bundle, so nothing to review.
    paths:
      - "registry/**/*.json"
      - "ercs/**/*.json"
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pull_request }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # The wait for Registry Checks and Descriptor Tests, then for the bundle.
    timeout-minutes: 60
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      # Under pull_request_target a checkout without ref is the base branch,
      # never the pull request.
      - name: Checkout the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the pull request and fetch its test report bundle
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_request }}
        run: node .github/scripts/ai-review-gate.js --pr "$PR_NUMBER" --out ai-review

      - name: Upload the test report bundle
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-bundle
          path: ai-review/bundle.json
          retention-days: 7
