name: Run Sourcify clear-signing tests
description: Clone and build @ethereum-sourcify/clear-signing-test-runner, then run it against the .tests.json fixture of each descriptor in the test matrix and write one results.json per descriptor, in the format in .github/test-runner-docs/.

inputs:
  test-matrix:
    description: JSON array of the descriptors to test, as detect-testsv2 outputs it. Each entry has entity, descriptor_name and test_file.
    required: true
  registry-root:
    description: Absolute path of the registry checkout. The test_file paths of the matrix are relative to it.
    required: true
  output-dir:
    description: Absolute path of the directory that receives one <entity>__<descriptor>.json per descriptor.
    required: true
outputs:
  results-dir:
    description: The directory that holds the results files.
    value: ${{ inputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Checkout Sourcify test runner
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: sourcifyeth/clear-signing-test-runner
        ref: dae3cdabd0eab26173d7f7a31a2ca7e75bf07daf # v0.2.2 main @ 2026-08-06 
        path: sourcify-test-runner
        persist-credentials: false

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      working-directory: sourcify-test-runner
      run: npm ci

    - name: Build
      shell: bash
      working-directory: sourcify-test-runner
      run: npm run build

    - name: Run tests
      shell: bash
      working-directory: sourcify-test-runner
      env:
        TEST_MATRIX: ${{ inputs.test-matrix }}
        REGISTRY_ROOT: ${{ inputs.registry-root }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        mkdir -p "$OUTPUT_DIR"
        # The runner exits 0 for a failed case and non-zero only for a crash.
        # A crash must not stop the other descriptors; upload-test-results
        # reports the missing results file.
        echo "$TEST_MATRIX" | jq -r '.[] | "\(.entity)\t\(.descriptor_name)\t\(.test_file)"' |
          while IFS=$'\t' read -r entity descriptor test_file; do
            echo "::group::${entity}/${descriptor}"
            node dist/cli.js "$REGISTRY_ROOT/$test_file" \
              --output "$OUTPUT_DIR/${entity}__${descriptor}.json" --verbose ||
              echo "::error file=${test_file}::The Sourcify runner exited with status $? for ${entity}/${descriptor}"
            echo "::endgroup::"
          done
