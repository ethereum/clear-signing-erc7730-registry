name: Run Rust (llbartekll/clear-signing) clear-signing tests
description: Install llbartekll/clear-signing's cs-test binary via cargo, run it against the .tests.json fixture of each descriptor in the test matrix and write one results.json per descriptor, in the format in .github/test-runner-docs/.

inputs:
  test-matrix:
    description: JSON array of the descriptors to test, as detect-testsv2 outputs it. Each entry has entity, descriptor_name and test_file.
    required: true
  registry-root:
    description: Absolute path of the registry checkout. The test_file paths of the matrix are relative to it.
    required: true
  output-dir:
    description: Absolute path of the directory that receives one <entity>__<descriptor>.json per descriptor.
    required: true

outputs:
  results-dir:
    description: The directory that holds the results files.
    value: ${{ inputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Checkout llbartekll/clear-signing
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: llbartekll/clear-signing
        ref: 10605ba78f3d6f3f13102e0f3a3ecbc44ac500dc # main @ 2026-08-13
        path: cs-runner
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: cs-runner

    - name: Install cs-test
      shell: bash
      working-directory: cs-runner
      run: cargo install --path crates/cs-test --locked

    - name: Run tests
      shell: bash
      env:
        TEST_MATRIX: ${{ inputs.test-matrix }}
        REGISTRY_ROOT: ${{ inputs.registry-root }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        mkdir -p "$OUTPUT_DIR"
        # --registry points at the registry tree, so the runner resolves a
        # nested-call descriptor (Safe inner call, kiln inner deposit) from
        # anywhere in the tree, not only beside the test file.
        #
        # The runner exits 0 for a failed case and non-zero only for a crash.
        # A crash must not stop the other descriptors; upload-test-results
        # reports the missing results file.
        echo "$TEST_MATRIX" | jq -r '.[] | "\(.entity)\t\(.descriptor_name)\t\(.test_file)"' |
          while IFS=$'\t' read -r entity descriptor test_file; do
            echo "::group::${entity}/${descriptor}"
            cs-test run "$REGISTRY_ROOT/$test_file" --registry "$REGISTRY_ROOT/registry" \
              --output "$OUTPUT_DIR/${entity}__${descriptor}.json" ||
              echo "::error file=${test_file}::The Rust runner exited with status $? for ${entity}/${descriptor}"
            echo "::endgroup::"
          done
