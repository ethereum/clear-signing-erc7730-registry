[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
code_size_limit = 1000000
gas_limit = 1000000000
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./" }]
